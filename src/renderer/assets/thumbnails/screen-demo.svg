<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <rect width="320" height="180" rx="8" fill="#111827"/>
  <rect x="14" y="14" width="292" height="152" rx="4" fill="#0B0F16" stroke="#1F2937" stroke-width="2"/>
  <!-- 大景框（上下文） -->
  <rect x="26" y="26" width="120" height="128" rx="4" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.5"/>
  <text x="86" y="146" font-family="sans-serif" font-size="11" fill="#38BDF8" opacity="0.8" text-anchor="middle">大景</text>
  <!-- 中景框 -->
  <rect x="96" y="44" width="104" height="92" rx="4" fill="none" stroke="#A78BFA" stroke-width="1.5" opacity="0.7"/>
  <text x="148" y="130" font-family="sans-serif" font-size="11" fill="#A78BFA" opacity="0.85" text-anchor="middle">中景</text>
  <!-- 小景特写框（当前镜头，高亮） -->
  <rect x="150" y="62" width="92" height="60" rx="4" fill="#0B0F16" stroke="#F59E0B" stroke-width="2"/>
  <rect x="162" y="76" width="42" height="7" rx="3.5" fill="#F8FAFC" opacity="0.35"/>
  <rect x="162" y="90" width="66" height="6" rx="3" fill="#F8FAFC" opacity="0.18"/>
  <text x="196" y="116" font-family="sans-serif" font-size="11" fill="#F59E0B" text-anchor="middle">小景特写</text>
  <!-- 点击渐晕示意 -->
  <circle cx="196" cy="92" r="30" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.35" stroke-dasharray="3 3"/>
  <!-- 光标 + 点击波纹 -->
  <circle cx="196" cy="92" r="9" fill="none" stroke="#F8FAFC" stroke-width="1.4" opacity="0.55"/>
  <path d="M193 87 L193 99 L197.5 95.4 L200.5 102 L203.1 100.7 L200.1 94 L206 94 Z" fill="#FFFFFF" stroke="#111827" stroke-width="1"/>
  <!-- 悬浮卡片 -->
  <rect x="236" y="24" width="60" height="38" rx="6" fill="#1E293B" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <rect x="244" y="33" width="30" height="6" rx="3" fill="#F8FAFC" opacity="0.3"/>
  <rect x="244" y="44" width="42" height="5" rx="2.5" fill="#F8FAFC" opacity="0.16"/>
  <!-- 倾斜循环提示 -->
  <text x="36" y="152" font-family="sans-serif" font-size="10" fill="#94A3B8" opacity="0.7">-2° / 0 / +2°</text>
