<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <rect width="320" height="180" rx="8" fill="#F6F3EE"/>
  <!-- 背景氛围：模糊素材底（有素材时的暗场） -->
  <rect x="0" y="120" width="320" height="60" rx="8" fill="#2B2620" opacity="0.1"/>
  <rect x="0" y="0" width="320" height="66" rx="8" fill="#C2872F" opacity="0.06"/>
  <!-- 空中下落中的行（rotateX 仰角 + 运动残影，从画框上方砸向面板） -->
  <g transform="rotate(-4 160 22)">
    <rect x="56" y="6" width="208" height="19" rx="5" fill="#FFFDFA" stroke="#C2872F" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="67" cy="15.5" r="5.5" fill="#C2872F" opacity="0.8"/>
    <rect x="78" y="12.5" width="66" height="6" rx="3" fill="#2B2620" opacity="0.55"/>
    <rect x="196" y="10" width="60" height="11" rx="3" fill="#8A7458" opacity="0.45"/>
  </g>
  <rect x="150" y="28" width="64" height="3" rx="1.5" fill="#C2872F" opacity="0.3"/>
  <rect x="132" y="33" width="44" height="3" rx="1.5" fill="#C2872F" opacity="0.18"/>
  <!-- 面板：承载标题与行列表 -->
  <rect x="40" y="38" width="240" height="116" rx="10" fill="#FFFDFA" stroke="#2B2620" stroke-opacity="0.08"/>
  <rect x="56" y="50" width="92" height="11" rx="5.5" fill="#2B2620"/>
  <rect x="56" y="67" width="62" height="6" rx="3" fill="#2B2620" opacity="0.32"/>
  <!-- 行 1：已嵌入，底边强调色缝（只闪一次、只在下边） -->
  <rect x="56" y="82" width="208" height="19" rx="5" fill="#F7F3EB"/>
  <circle cx="67" cy="91.5" r="5.5" fill="#C2872F"/>
  <rect x="78" y="88.5" width="72" height="6" rx="3" fill="#2B2620" opacity="0.72"/>
  <rect x="196" y="86" width="60" height="11" rx="3" fill="#8A7458" opacity="0.55"/>
  <rect x="56" y="100" width="148" height="2" rx="1" fill="#C2872F"/>
  <!-- 行 2：已嵌入 -->
  <rect x="56" y="106" width="208" height="19" rx="5" fill="#F7F3EB"/>
  <circle cx="67" cy="115.5" r="5.5" fill="#C2872F" opacity="0.9"/>
  <rect x="78" y="112.5" width="58" height="6" rx="3" fill="#2B2620" opacity="0.68"/>
  <rect x="196" y="110" width="60" height="11" rx="3" fill="#8A7458" opacity="0.5"/>
  <!-- 行 3：空槽虚线占位（等待下一行落地） -->
  <rect x="56" y="130" width="208" height="19" rx="5" fill="none" stroke="#2B2620" stroke-opacity="0.24" stroke-dasharray="4 3"/>
</svg>
